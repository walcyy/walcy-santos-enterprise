name: Refresh Netlify Publish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Netlify refresh marker
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .netlify-refresh

      - name: Push refresh commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .netlify-refresh
          git commit -m 'Trigger Netlify portfolio publish' || exit 0
          git push origin main
