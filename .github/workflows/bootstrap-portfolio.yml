name: Bootstrap Portfolio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-portfolio.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download portfolio source
        run: |
          curl -fL 'https://walcy-portfolio-source-bootstrap-4zcfmq.v2.appdeploy.ai/walcy-source-bootstrap.zip' -o /tmp/walcy-source.zip
          rm -rf /tmp/walcy-source
          mkdir -p /tmp/walcy-source
          unzip -q /tmp/walcy-source.zip -d /tmp/walcy-source
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/walcy-source/ ./
      - name: Download portfolio photos
        run: |
          mkdir -p public/resources
          curl -fL 'https://walcy-santos-enterprise-portfolio-jkgvr3.v2.appdeploy.ai/resources/foto-1.jpeg' -o public/resources/foto-1.jpeg
          curl -fL 'https://walcy-santos-enterprise-portfolio-jkgvr3.v2.appdeploy.ai/resources/foto-2.png' -o public/resources/foto-2.png
      - name: Commit portfolio project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Walcy Santos enterprise portfolio source' || exit 0
          git push origin main
