name: Bootstrap Portfolio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-portfolio.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Capture validated portfolio build
        run: |
          set -eu
          APP_URL='https://walcy-santos-enterprise-portfolio-jkgvr3.v2.appdeploy.ai/'
          rm -rf dist
          mkdir -p dist/assets dist/resources
          curl -fsSL "$APP_URL" -o /tmp/appdeploy-index.html
          JS_URL=$(grep -m1 -oE 'https://[^" ]+/assets/index-[^" ]+\.js' /tmp/appdeploy-index.html)
          CSS_URL=$(grep -m1 -oE 'https://[^" ]+/assets/index-[^" ]+\.css' /tmp/appdeploy-index.html)
          test -n "$JS_URL"
          test -n "$CSS_URL"
          JS_FILE=$(basename "$JS_URL")
          CSS_FILE=$(basename "$CSS_URL")
          curl -fL "$JS_URL" -o "dist/assets/$JS_FILE"
          curl -fL "$CSS_URL" -o "dist/assets/$CSS_FILE"
          curl -fL "${APP_URL}resources/foto-1.jpeg" -o dist/resources/foto-1.jpeg
          curl -fL "${APP_URL}resources/foto-2.png" -o dist/resources/foto-2.png
          cat > dist/index.html <<EOF
          <!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta name="description" content="Portfólio corporativo de Walcy Santos — Software, Cloud, Dados e Infraestrutura." />
              <title>Walcy Santos — Enterprise Technology Portfolio</title>
              <script type="module" crossorigin src="./assets/$JS_FILE"></script>
              <link rel="stylesheet" crossorigin href="./assets/$CSS_FILE" />
            </head>
            <body>
              <div id="root"></div>
            </body>
          </html>
          EOF
          test -s dist/index.html
          test -s "dist/assets/$JS_FILE"
          test -s "dist/assets/$CSS_FILE"
          test -s dist/resources/foto-1.jpeg
          test -s dist/resources/foto-2.png

      - name: Configure Netlify static publish
        run: |
          cat > netlify.toml <<'EOF'
          [build]
            command = "echo 'Prebuilt Walcy Santos portfolio ready'"
            publish = "dist"
          EOF

      - name: Commit independent production build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make portfolio build independent for Netlify' || exit 0
          git push origin main
